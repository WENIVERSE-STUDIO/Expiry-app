<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>만료일 비서</title>
  <meta name="description" content="한 번 등록하면 알아서 알려주는 생활 만료일 비서">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="top__eyebrow">WENIVERSE LAB</p>
      <h1 class="top__title">만료일 비서</h1>
    </div>
    <button id="notify-btn" class="icon-btn" aria-label="알림 켜기" title="알림 켜기">🔔</button>
  </header>

  <section class="summary" aria-label="요약">
    <div class="summary__item summary__item--expired"><strong id="count-expired">0</strong><span>지났어요</span></div>
    <div class="summary__item summary__item--soon"><strong id="count-soon">0</strong><span>곧 만료</span></div>
    <div class="summary__item"><strong id="count-all">0</strong><span>전체</span></div>
  </section>

  <nav class="filters" id="filters" aria-label="분류 필터"></nav>

  <main>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden>
      <p class="empty__emoji">🗓️</p>
      <p><strong>아직 등록한 항목이 없어요</strong></p>
      <p>화장품 개봉일, 쓰레기 배출일, 계약 만료일을<br>한 번만 등록하면 알아서 알려드려요.</p>
    </div>
  </main>

  <button class="fab" id="add-btn">＋ 추가</button>

  <dialog id="dialog">
    <form id="form" method="dialog">
      <h2 id="dialog-title">새 항목</h2>

      <fieldset class="cats" id="form-cats">
        <legend class="visually-hidden">분류</legend>
      </fieldset>

      <p class="hint" id="hint"></p>
      <div class="presets" id="presets"></div>

      <label>이름
        <input name="name" required maxlength="40" placeholder="예: 비타민C 세럼">
      </label>

      <label><span id="start-label">시작일</span>
        <input name="start" type="date" required>
      </label>

      <div class="row">
        <label>기간
          <input name="amount" type="number" min="1" max="999" required value="6">
        </label>
        <label>단위
          <select name="unit">
            <option value="day">일</option>
            <option value="week">주</option>
            <option value="month" selected>개월</option>
            <option value="year">년</option>
          </select>
        </label>
      </div>

      <label class="check">
        <input name="repeat" type="checkbox"> 주기마다 반복
      </label>

      <label class="check">
        <input name="calendar" type="checkbox"> 📅 저장 후 내 캘린더에도 추가
      </label>

      <p class="preview" id="preview"></p>

      <div class="actions">
        <button type="button" class="btn btn--ghost" id="cancel-btn">취소</button>
        <button type="submit" class="btn btn--primary">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="cal-dialog">
    <div class="cal">
      <h2>📅 캘린더에 추가</h2>
      <p class="cal__desc" id="cal-desc"></p>
      <p class="cal__event" id="cal-event"></p>
      <button type="button" class="btn btn--primary cal__btn" id="cal-ics">
        기본 캘린더에 추가
        <small>아이폰 · 삼성 · 네이버 캘린더 (.ics 파일)</small>
      </button>
      <button type="button" class="btn btn--ghost cal__btn" id="cal-google">
        구글 캘린더에 추가
        <small>안드로이드에서 구글 캘린더를 쓴다면</small>
      </button>
      <p class="hint" id="cal-note"></p>
      <div class="actions">
        <button type="button" class="btn btn--ghost" id="cal-close">닫기</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
